name: Issue 1317 Linux validation

on:
  push:
    branches: [feat/issue-1317-replacement-refresh-validation]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.14'
      - name: Install ripgrep
        run: |
          curl -fsSL --retry 2 --max-time 60 -o "$RUNNER_TEMP/rg.tar.gz" https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf "$RUNNER_TEMP/rg.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ripgrep-14.1.1-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: go build ./...
      - run: make test
      - run: go vet ./...
      - name: Replace-bar regressions under the race detector
        run: go test -race ./tests/e2e -run '^TestReplaceBar' -count=1
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.14'
      - run: make fmt-check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
